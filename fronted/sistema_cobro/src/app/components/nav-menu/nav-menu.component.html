<nav class="nav-menu" [class.collapsed]="isCollapsed">
  <div class="nav-header">
    @if (!isCollapsed) {
      <span class="nav-title">Sistema Cobro</span>
    }
    <button class="toggle-btn" (click)="toggle()" [title]="isCollapsed ? 'Expandir menú' : 'Contraer menú'">
      <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
  </div>

  <div class="nav-items">
    @for (item of menuItems; track item.route) {
      <app-menu-item [item]="item" [collapsed]="isCollapsed"></app-menu-item>
    }
  </div>

  <div class="nav-footer">
    @if (!isCollapsed) {
      <span class="version">v1.0.0</span>
    }
  </div>
</nav>
